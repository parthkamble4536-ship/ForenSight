name: ForenSight CI — Forensic Analysis Platform

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Full Test Suite across Python 3.11, 3.12, 3.13
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Test Suite — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: "📦 Install system dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmagic1 libmagic-dev

      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: "🔧 Generate synthetic evidence specimens"
        run: python scripts/generate_samples.py

      - name: "🔧 Run environment verification audit"
        run: python scripts/verify_setup.py

      - name: "🧪 Run full automated test suite"
        run: python -m pytest tests/ -v --tb=short --color=yes

      - name: "📊 Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: .pytest_cache/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Static Application Security Testing (Bandit SAST)
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: "🔐 SAST Security Scan (Bandit)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: "📦 Install Bandit SAST scanner"
        run: pip install bandit[toml]

      - name: "🔐 Run Bandit high-severity security scan"
        run: |
          bandit -r forensight/ scripts/ -lll -q
          echo "Bandit SAST passed — zero high-severity findings"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Docker Build Verification
  # Uses docker buildx bake / plain docker build so the image is loaded into
  # the local daemon and can be referenced by docker run in the next step.
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker Build Verification"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🐳 Build Docker image and load into daemon"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: forensight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "🩺 Verify container health endpoint"
        run: |
          docker run -d --name fs-ci -p 8000:8000 forensight:ci
          echo "Waiting for container to be ready..."
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "Container is healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -f http://127.0.0.1:8000/api/v1/health || (docker logs fs-ci && exit 1)
          docker stop fs-ci
          echo "Docker health check passed"
